# Render Blueprint: one Docker web service. Secrets are declared WITHOUT values (sync: false) and are
# entered in the Render dashboard; they are never stored in this repo.
services:
  - type: web
    name: tasteroom
    runtime: docker
    # "starter" is always-on (no cold starts while judges look). "free" sleeps after ~15 min idle:
    # if you use it, set up the keep-alive ping described in DEPLOY.md.
    plan: starter
    healthCheckPath: /api/health
    # Invite rooms live in SQLite on this disk (needs a paid instance type; remove the block on `free`).
    disk:
      name: tasteroom-data
      mountPath: /data
      sizeGB: 1
    autoDeploy: true
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_FAST
        value: gpt-6-luna
      - key: OPENAI_MODEL_SMART
        value: gpt-6.1-sol
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: RATE_LIMIT_PLAN
        value: 5/hour
      - key: DATA_DIR
        value: /data
      - key: APP_ENV
        value: production
